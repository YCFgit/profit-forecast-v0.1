# 生产环境 Docker Compose
version: "3.8"

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: profit-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-ycf0312!}
      MYSQL_DATABASE: profit_forecast
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: profit-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # FastAPI 后端 + 前端
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: profit-api
    environment:
      DATABASE_URL: mysql+aiomysql://root:${DB_PASSWORD:-ycf0312!}@mysql:3306/profit_forecast
      DATABASE_URL_SYNC: mysql+pymysql://root:${DB_PASSWORD:-ycf0312!}@mysql:3306/profit_forecast
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      APP_DEBUG: "false"
      DATAWORKS_ADAPTER: mock
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Celery Worker（异步任务）
  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: profit-worker
    command: celery -A src.tasks.worker worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: mysql+aiomysql://root:${DB_PASSWORD:-ycf0312!}@mysql:3306/profit_forecast
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
