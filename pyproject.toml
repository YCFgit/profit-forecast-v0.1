[project]
name = "profit-forecast"
version = "0.1.0"
description = "鞋服零售利润测算系统 — 基线预估 × 承压分配 × 利润测算"
requires-python = ">=3.11"
dependencies = [
    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    # 数据库
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.0",
    "pymysql>=1.1.0",  # StarRocks MySQL 协议
    # 缓存
    "redis>=5.0.0",
    # 数据处理
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    # 时间序列预测
    "statsmodels>=0.14.0",
    "prophet>=1.1.0",
    "scikit-learn>=1.5.0",
    # 任务队列
    "celery[redis]>=5.4.0",
    # 配置管理
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    # 数据校验
    "pandera>=0.20.0",
    # Excel 处理
    "openpyxl>=3.1.0",
    "xlsxwriter>=3.2.0",
    # HTTP 客户端（DataWorks API）
    "httpx>=0.27.0",
    # 日志
    "loguru>=0.7.0",
    # 工具
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.0",
    "httpx>=0.27.0",  # FastAPI TestClient
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 300
markers = [
    "slow: 长时间运行的测试",
    "integration: 集成测试",
    "legacy: 已废弃的 v1 统计模型测试（ARIMA/Prophet/ExpSmoothing）",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/api/routes/*",  # API 路由由集成测试覆盖
    "src/tasks/*",       # Celery 任务
]

[tool.coverage.report]
show_missing = true
fail_under = 50
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]
